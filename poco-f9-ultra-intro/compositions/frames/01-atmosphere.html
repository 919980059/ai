  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
  <script>
    // Frame 1 — Chapter 1, the hero name. Three beats on the opening bars:
    // brand flash (0.15), light-sweep + product rise (0.65–2.1), name stack
    // + platform ticker (1.3–3.2), then a held read to the 4.22 cut where
    // everything exits together across the 0.5s overlap into Chapter 2's
    // dark stage. All entrance from-states either equal the authored CSS
    // (opacity 0) or sit on elements that are invisible until the tween
    // starts, so no entrance needs immediateRender management.
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const byId = (id) => document.getElementById(id);
    const sweep = byId("01-atmosphere-sweep");
    const leftscrim = byId("01-atmosphere-leftscrim");
    const brand = byId("01-atmosphere-brand");
    const phoneImg = byId("01-atmosphere-phone-img");
    const titleLabel = byId("01-atmosphere-title-label");
    const titleName = byId("01-atmosphere-title-name");
    const titleSub = byId("01-atmosphere-title-sub");
    const tickerRows = [
      byId("01-atmosphere-ticker-row1"),
      byId("01-atmosphere-ticker-row2"),
      byId("01-atmosphere-ticker-row3"),
    ];

    // Beat 1 — POCO brand stamp: center flash in, hold, release out. The
    // out-tween conflicts with the in-tween on opacity/scale, so
    // immediateRender: false keeps its from-state from painting early.
    tl.fromTo(
      brand,
      { opacity: 0, scale: 0.96 },
      { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out", transformOrigin: "50% 50%" },
      0.15
    );
    tl.fromTo(
      brand,
      { opacity: 1, scale: 1 },
      { opacity: 0, scale: 1.05, duration: 0.4, ease: "power2.inOut", immediateRender: false },
      1.0
    );

    // Beat 1b — the contrast bed fades up 0.4–1.1, ahead of the name stack
    // (1.3) so the type never lands on raw footage; the sweep (z1, below
    // this bed at z2) dims slightly through the left zone as it crosses —
    // reads as the light escaping into the clear right side. From-state
    // (opacity 0) equals the authored CSS, so no immediateRender hazard.
    // NO exit tween by design: the ambient footage's window ends AT 4.22,
    // so past the cut this bed is black-over-black — inert — and Chapter
    // 2's rising stage (DOM-later root) paints above it regardless.
    tl.fromTo(leftscrim, { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.4);

    // Beat 2 — light-sweep: the rotated band crosses left→right behind the
    // phone while the product rises. Motion and opacity envelope are
    // separate tweens (different shapes); the envelope's second leg carries
    // immediateRender: false because its from-state (0.7) differs from the
    // authored 0 and it conflicts with the first leg on opacity.
    tl.fromTo(
      sweep,
      { x: -1150, rotation: 14 },
      { x: 1650, rotation: 14, duration: 1.0, ease: "power2.inOut" },
      0.65
    );
    tl.fromTo(sweep, { opacity: 0 }, { opacity: 0.7, duration: 0.35, ease: "power2.out" }, 0.65);
    tl.fromTo(
      sweep,
      { opacity: 0.7 },
      { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false },
      1.3
    );

    // Beat 2b — the product rises out of the black: y +70 → 0 with a
    // 1.06 → 1 scale settle, power3.out long tail. From-state opacity 0
    // equals the authored CSS, so no immediateRender hazard.
    tl.fromTo(
      phoneImg,
      { opacity: 0, y: 70, scale: 1.06 },
      { opacity: 1, y: 0, scale: 1, duration: 1.25, ease: "power3.out", transformOrigin: "50% 50%" },
      0.85
    );

    // Beat 3 — the name stacks up: label → F9 → ULTRA, staggered 0.12s,
    // each a rise-and-settle; complete at 2.24s.
    tl.fromTo(titleLabel, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.3);
    tl.fromTo(titleName, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.42);
    tl.fromTo(titleSub, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.54);

    // Beat 3b — platform ticker: three spec rows, 0.18s stagger; complete
    // at 3.16s, then a held read to the cut.
    tickerRows.forEach((row, i) => {
      tl.fromTo(row, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.3 + i * 0.18);
    });

    // Exits (4.22–4.72): every layer dissolves across the overlap into
    // Chapter 2's dark stage — the title slides left as it fades, the
    // phone lifts away, the ticker sinks. All conflict with their entrance
    // tweens on opacity, so every exit carries immediateRender: false
    // (deferred-paint law; see the long note in 02-name-reveal's exits).
    tl.fromTo(
      phoneImg,
      { opacity: 1, y: 0 },
      { opacity: 0, y: -30, duration: 0.5, ease: "power2.inOut", immediateRender: false },
      4.22
    );
    [titleLabel, titleName, titleSub].forEach((el) => {
      tl.fromTo(
        el,
        { opacity: 1 },
        { opacity: 0, x: -40, duration: 0.5, ease: "power2.inOut", immediateRender: false },
        4.22
      );
    });
    tickerRows.forEach((row) => {
      tl.fromTo(
        row,
        { opacity: 1 },
        { opacity: 0, y: 12, duration: 0.5, ease: "power2.inOut", immediateRender: false },
        4.22
      );
    });

    // Full-span anchor: the timeline's duration equals the frame slot
    // (4.22s content + the 0.5s crossfade tail).
    tl.to({}, { duration: 4.72 }, 0);

    window.__timelines["01-atmosphere"] = tl;
  </script>
