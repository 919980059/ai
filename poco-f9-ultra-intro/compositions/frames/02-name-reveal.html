  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
  <script>
    // Frame 2 — Chapter 2, Imaging Unbound. Local 0 = global 4.22 (the cut
    // to black). The stage materializes 0–0.4 while Frame 1's layers
    // dissolve beneath this root; the card ignites at 0.40 under the closed
    // cover and develops open by 0.95; the stat block counts up through the
    // develop; the optics lines complete by 1.65; the card's interior hard-
    // cuts demo A→B at 1.80 (global 6.02, the breathing point — pure host
    // DOM layering, no tween); a held read to 3.30; then the mirrored exit
    // (cover closes 3.30–3.66, type out 3.39–3.79, stage dissolves
    // 3.39–3.89) crosses into Frame 3's rising lockup.
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const byId = (id) => document.getElementById(id);
    const stage = byId("02-name-reveal-stage");
    const cover = byId("02-name-reveal-cover");
    const kicker = byId("02-name-reveal-kicker");
    const countrow = byId("02-name-reveal-countrow");
    const count = byId("02-name-reveal-count");
    const sub1 = byId("02-name-reveal-sub1");
    const hairline = byId("02-name-reveal-hairline");
    const sub2 = byId("02-name-reveal-sub2");

    // Entrances. Every fromTo's from-state equals its authored CSS state
    // (stage/type 0, cover 1, hairline scaleX 0, count text "0"), so no
    // entrance needs immediateRender management.
    tl.fromTo(stage, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
    tl.fromTo(kicker, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.15);
    // The develop: cover 1 → 0 across 0.40–0.95, synced to demo A's window
    // opening at 0.40 — the drift is already underway as the shutter lifts.
    tl.fromTo(cover, { opacity: 1 }, { opacity: 0, duration: 0.55, ease: "power2.inOut" }, 0.4);
    tl.fromTo(countrow, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
    // The count-up: 0→200 in 0.85s, snapped to integers — seek-safe stat hit
    // (textContent tween; the unit rides the numeral's right edge).
    tl.fromTo(
      count,
      { textContent: 0 },
      { textContent: 200, duration: 0.85, ease: "power2.out", snap: { textContent: 1 } },
      0.55
    );
    tl.fromTo(sub1, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.85);
    tl.fromTo(hairline, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 1.0);
    tl.fromTo(sub2, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.15);

    // Held read 1.65–3.30: no frame tween; the cards' Ken Burns drift (host
    // timeline) is the frame's aliveness (demo A to 1.80, demo B after).

    // Exits. The cover closes FIRST (3.30–3.66, power2.out so it is ~80%
    // shut by 3.5): demo B's host window ends at local 3.68, so the footage
    // vanishes under a shutter that is already ≥97% closed — no pop. The
    // type lifts out 3.39–3.79 and the stage dissolves 3.39–3.89, its fade
    // completing exactly at the slot end so Frame 3's emerging footage is
    // never hard-unmasked by the 0.92 shadow. immediateRender: false on
    // every exit: each conflicts with an earlier tween on the same property
    // (deferred-paint law — without the flag, the first render lands in the
    // pre-entrance gap and would paint these from-states early: the cover
    // open at local 0, the type/stage at full before their entrances).
    tl.fromTo(
      cover,
      { opacity: 0 },
      { opacity: 1, duration: 0.36, ease: "power2.out", immediateRender: false },
      3.3
    );
    [kicker, countrow, sub1, sub2].forEach((el) => {
      tl.fromTo(
        el,
        { opacity: 1, y: 0 },
        { opacity: 0, y: -12, duration: 0.4, ease: "power2.inOut", immediateRender: false },
        3.39
      );
    });
    tl.fromTo(
      hairline,
      { opacity: 1 },
      { opacity: 0, duration: 0.4, ease: "power2.inOut", immediateRender: false },
      3.39
    );
    tl.fromTo(
      stage,
      { opacity: 1 },
      { opacity: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false },
      3.39
    );

    // Full-span anchor: the timeline's duration equals the frame slot
    // (3.39s content + the 0.5s crossfade tail).
    tl.to({}, { duration: 3.89 }, 0);

    window.__timelines["02-name-reveal"] = tl;
  </script>
