      <!-- ── Ambient background: the product page turned to light ──
        Five product-free section backgrounds (connectivity streaks, Game
        HDR, IceLoop + two deep sections) blended to one canvas, tinted
        toward POCO gold, defocused offline (σ70) with a warm glow baked
        around the bright cores: an overall out-of-focus golden field
        across the whole frame — no literal component, no
        single subject; only the product is ever sharp. Both videos share
        one finishing grade in data-color-grading (canonical slots, no
        CSS/SVG equivalents): vignette 0.32 sinks the corners so the center
        reads as a light pool, grain 0.65 keeps the large soft gradient
        filmic and banding-free — the product and type (DOM) stay clean
        above it. The halo around the light is baked into the asset itself
        (build_pageglow.py glow pass) because the shader's bloom slot is
        threshold-gated near 170 luma, which this field (max ~109) never
        reaches — bloom stays 0 and the glow lives where it is real.
        Plays under Chapter
        1 (hero) and Chapter 3 (lockup). It is ABSENT in
        Chapter 2 (4.22–7.61): the camera chapter is a near-black stage so
        the two bright demo cards own the frame (see 02-name-reveal.html).
        Window law per frame: mediaStart + rate×window ≤ 2.16s source.
        Chapter 3 plays the -ftb copy: same-source footage drifting in
        reverse, with a fade-to-black tail (fading media 1.72→1.90, black
        through 2.16 — global 10.15→10.51
        melt, black to the end). Why: the render's LAST MP4 frame captures a
        torn-down page — every timed DOM element already hidden, but this
        media element still painting, parked at its window end at full
        brightness; no DOM authoring can touch those pixels, so the film
