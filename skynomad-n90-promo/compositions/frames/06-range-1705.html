    .f06-pagenum .f06-on{color:#D9B8A6;}
  </style>

  <div data-hf-id="hf-xy7z" id="root" data-composition-id="06-range-1705" data-width="1920" data-height="1080" data-duration="5.3">

    <div data-hf-id="hf-r8ss" class="clip f06-stage" data-start="0" data-duration="5.3" data-track-index="0">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "06-range-1705";
      window.__timelines = window.__timelines || {};

      var root =
        document.querySelector('div[data-composition-id="' + ID + '"] #root') ||
        document.querySelector('#root[data-composition-id="' + ID + '"]');
      if (!root || typeof gsap === "undefined") { return; }

      var find = function (sel) { return root.querySelector(sel); };
      var world     = find(".f06-world");
      var bannerGrp = find(".f06-bannerGrp");
      var st1       = find(".f06-st1");
      var st2       = find(".f06-st2");
      var sea       = find(".f06-sea");
      var numGrp    = find(".f06-numGrp");
      var num       = find(".f06-num");
      var kmlabel   = find(".f06-kmlabel");
      var far       = find(".f06-far");
      var pn        = find(".f06-pagenum");

      /* ── Camera ─────────────────────────────────────────────────────────
         One state, one writer. cam = {scale, x, y} on the single .world
         wrapper; every leg is a sequential fromTo tween on it, so any seek
         reproduces the exact mid-leg pose. All world layout is authored in
         absolute px, so every leg target below is a precomputed constant —
         no getBoundingClientRect anywhere, not even at setup.

         center-on-world-point math: x = −(px−960)·s, y = −(py−540)·s        */
      var cam = { scale: 2.60, x: 884, y: 312 };
      function applyCamera() {
        world.style.transform =
          "translate(" + cam.x + "px," + cam.y + "px) scale(" + cam.scale + ")";
      }

      /* leg poses (precomputed):
         P0 start  — tight on banner texture:  center (620, 420)  @ s 2.60
         P1 dwell — between both stations:  center (1270, 430) @ s 2.42
         P2 dive   — landed on the 1705 zone:  center (500, 470)  @ s 1.30
         P3 rest   — the widened world:        center (960, 540)  @ s 1.00  */
      var P0 = { scale: 2.60, x:  884, y:  312 };
      var P1 = { scale: 2.42, x: -750, y: 266 };
      var P2 = { scale: 1.30, x:  598, y:   91 };
      var P3 = { scale: 1.00, x:    0, y:    0 };

      var tl = gsap.timeline({ paused: true, onUpdate: applyCamera });

      /* Scene 1 (0–0.20) 影界启程 — world holds the start pose; the first
         tween's from-state IS the pose (immediateRender at build). */

      /* Scene 2 (0.20–0.95) 横向推进 — pan-stations tracking along the
         banner, slow-fast-slow; velocity blur peaks softer (13→10px,
         2026-09-14 readability pass) and resolves to zero at the landing.
         The pan now lands BETWEEN the two stations, not past them. */
      tl.fromTo(cam, { scale: P0.scale, x: P0.x, y: P0.y },
        { scale: P1.scale, x: P1.x, y: P1.y, duration: 0.75, ease: "power2.inOut" }, 0.20);
      tl.fromTo(world, { filter: "blur(0px)" },
        { filter: "blur(10px)", duration: 0.32, ease: "power1.in", immediateRender: false }, 0.20);
      tl.fromTo(world, { filter: "blur(10px)" },
        { filter: "blur(0px)", duration: 0.40, ease: "power2.out", immediateRender: false }, 0.55);

      /* 技术站位 soft-blur-in as the camera decelerates onto them; both then
         hold sharp and static through the dwell (0.95–1.85) — 2026-09-14
         readability fix: the selling points used to sweep past unreadable */
      tl.fromTo(st1,
        { opacity: 0, y: 16, filter: "blur(8px)" },
        { opacity: 0.9, y: 0, filter: "blur(0px)", duration: 0.50, ease: "power2.out", immediateRender: false }, 0.68);
      tl.fromTo(st2,
        { opacity: 0, y: 16, filter: "blur(8px)" },
        { opacity: 0.9, y: 0, filter: "blur(0px)", duration: 0.50, ease: "power2.out", immediateRender: false }, 0.85);

      /* chrome — the pagenum chip waits out the F5→F6 blur crossfade (0.6s)
         before landing, so the two frames' chips never stack at the corner */
      tl.fromTo(pn, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.62);

      /* Scene 4 (1.85–3.05) 俯冲落数字 — power4.out violent arrival; the
         banner group (stations now read) falls out of focus behind (DoF),
         the number reveals sharp and counts 0→1705 with its scale growing
         (读音毕数字毕：计数与俯冲同秒落定). */
      tl.fromTo(cam, { scale: P1.scale, x: P1.x, y: P1.y },
        { scale: P2.scale, x: P2.x, y: P2.y, duration: 1.20, ease: "power4.out", immediateRender: false }, 1.85);
      tl.fromTo(bannerGrp, { filter: "blur(0px)" },
        { filter: "blur(12px)", duration: 0.78, ease: "power2.in", immediateRender: false }, 1.87);

      tl.fromTo(numGrp, { opacity: 0, filter: "blur(12px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out", immediateRender: false }, 1.89);

      var count = { v: 0 };
      tl.fromTo(count, { v: 0 },
        { v: 1705, duration: 1.12, ease: "power2.out", immediateRender: false,
          onUpdate: function () { num.textContent = Math.round(count.v); } }, 1.93);
      tl.fromTo(num, { scale: 0.86 },
        { scale: 1, duration: 1.12, ease: "power2.out", immediateRender: false }, 1.93);

      tl.fromTo(kmlabel,
        { opacity: 0, y: 14, filter: "blur(8px)" },
        { opacity: 0.85, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out", immediateRender: false }, 2.58);

      /* Scene 5 (3.05–3.35) 破折号屏息 — the held shot after the dive:
         no tween touches the camera across this window. */

      /* Scene 6 (3.35–4.15) 远方拉开 — pull-back to rest; the seascape
         rises from behind the number, the banner dissolves, 「远方」lands. */
      tl.fromTo(cam, { scale: P2.scale, x: P2.x, y: P2.y },
        { scale: P3.scale, x: P3.x, y: P3.y, duration: 0.80, ease: "power3.inOut", immediateRender: false }, 3.35);
      tl.fromTo(sea, { opacity: 0, y: 70 },
        { opacity: 1, y: 0, duration: 0.77, ease: "power2.out", immediateRender: false }, 3.35);
      tl.fromTo(bannerGrp, { opacity: 1 },
        { opacity: 0, duration: 0.37, ease: "power1.in", immediateRender: false }, 3.35);
      tl.fromTo(far,
        { opacity: 0, y: 18, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.47, ease: "power3.out", immediateRender: false }, 3.35);

      /* Scene 7 (4.15–5.30) 静持 — number + seascape dead static to the
         frame end; the pad tween only pins the total duration. */
      tl.to({}, { duration: 0.50 }, 4.80);

      applyCamera();
      window.__timelines[ID] = tl;
    })();
  </script>
